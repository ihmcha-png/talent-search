<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>내부 인재 검색 - 연결 테스트</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f6f8fb;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #172033;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .description {
      color: #7b8799;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      border: 1px solid #e1e6ee;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 18px rgba(0,0,0,.03);
      margin-bottom: 20px;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .help {
      font-size: 12px;
      color: #7d899a;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) 56px;
      gap: 10px;
    }

    #query {
      height: 54px;
      border: 1px solid #dce3ec;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 15px;
      outline: none;
    }

    #query:focus {
      border-color: #2454db;
    }

    #micButton {
      height: 54px;
      border: 1px solid #cbd6e7;
      border-radius: 10px;
      background: #edf3ff;
      cursor: pointer;
      font-size: 22px;
    }

    #micButton.listening {
      background: #fff0f0;
      border-color: #ef5350;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }
    }

    .voice-panel {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: #f7f9fc;
      border: 1px solid #e2e7ef;
    }

    .voice-panel.show {
      display: block;
    }

    .voice-state {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #9aa6b6;
    }

    .dot.listening {
      background: #e5484d;
      animation: dotPulse 1s infinite;
    }

    .dot.success {
      background: #21a366;
    }

    .dot.error {
      background: #e5484d;
    }

    @keyframes dotPulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: .25;
      }

      100% {
        opacity: 1;
      }
    }

    #voiceMessage {
      margin-top: 9px;
      color: #6f7e92;
      font-size: 12px;
    }

    .recognized {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e1e6ed;
    }

    .recognized-label {
      color: #8a96a8;
      font-size: 11px;
      margin-bottom: 7px;
    }

    #recognizedText {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
    }

    .api-card {
      border-left: 5px solid #2454db;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding: 16px;
      border-radius: 10px;
      background: #f6f8fb;
      font-weight: 700;
    }

    .api-status.loading {
      color: #2454db;
    }

    .api-status.success {
      background: #eef8f2;
      color: #18794e;
    }

    .api-status.error {
      background: #fff2f2;
      color: #c93434;
    }

    .data-box {
      display: none;
      margin-top: 18px;
      border: 1px solid #e1e6ee;
      border-radius: 10px;
      overflow: hidden;
    }

    .data-box.show {
      display: block;
    }

    .data-row {
      display: grid;
      grid-template-columns: 180px minmax(0,1fr);
      border-bottom: 1px solid #edf0f4;
    }

    .data-row:last-child {
      border-bottom: 0;
    }

    .data-label {
      padding: 13px;
      background: #f7f9fc;
      font-size: 12px;
      font-weight: 800;
      color: #607086;
    }

    .data-value {
      padding: 13px;
      font-size: 13px;
      line-height: 1.6;
    }

    .retry-button {
      margin-top: 16px;
      height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #2454db;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

  </style>
</head>


<body>

<div class="page">

  <h1>
    내부 인재 검색
  </h1>

  <div class="description">
    GitHub Pages ↔ Apps Script 연결 테스트
  </div>


  <!-- ============================================
       API TEST
  ============================================= -->

  <div class="card api-card">

    <div class="title">
      ① Apps Script 연결 상태
    </div>

    <div class="help">
      이 페이지가 열리면 GitHub Pages에서
      Apps Script API에 직접 접속을 시도합니다.
    </div>

    <div
      id="apiStatus"
      class="api-status loading"
    >
      ⏳ Apps Script에 연결 중...
    </div>


    <div
      id="dataBox"
      class="data-box"
    >

      <div class="data-row">

        <div class="data-label">
          전체 인원
        </div>

        <div
          id="employeeCount"
          class="data-value"
        >
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          재직 상태
        </div>

        <div
          id="employmentStatus"
          class="data-value"
        >
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          BU
        </div>

        <div
          id="buList"
          class="data-value"
        >
          -
        </div>

      </div>


      <div class="data-row">

        <div class="data-label">
          학력
        </div>

        <div
          id="educationList"
          class="data-value"
        >
          -
        </div>

      </div>

    </div>


    <button
      class="retry-button"
      type="button"
      onclick="testAppsScriptConnection()"
    >
      다시 연결
    </button>

  </div>



  <!-- ============================================
       VOICE TEST
  ============================================= -->

  <div class="card">

    <div class="title">
      ② 음성 인식
    </div>

    <div class="help">
      기존에 성공한 음성 인식도 그대로 유지되는지 확인합니다.
    </div>


    <div class="search-row">

      <input
        id="query"
        type="text"
        placeholder="예: 재직 중이고 총 경력 5년 이상인 사람"
      >

      <button
        id="micButton"
        type="button"
        onclick="toggleVoice()"
      >
        🎤
      </button>

    </div>


    <div
      id="voicePanel"
      class="voice-panel"
    >

      <div class="voice-state">

        <div
          id="stateDot"
          class="dot"
        ></div>

        <span id="stateText">
          준비
        </span>

      </div>


      <div id="voiceMessage">
      </div>


      <div class="recognized">

        <div class="recognized-label">
          인식된 음성
        </div>

        <div id="recognizedText">
          -
        </div>

      </div>

    </div>

  </div>

</div>


<script>


/* =========================================================
   ★ 여기만 수정
   방금 확인한 Apps Script /exec 주소를 넣는다.
   ?api=initial 은 붙이지 않는다.
========================================================= */

const APPS_SCRIPT_URL =
  'https://script.google.com/a/macros/jnpmedi.com/s/AKfycbwr0MKCqLrjFo9V4sSNYu86htRi6jUOBqO9TP0Qv58FF3WfB9MoRK_dDwc4xXWd65XqGA/exec';


/* =========================================================
   API CONNECTION TEST
========================================================= */

window.addEventListener(
  'load',
  function() {

    initializeSpeechRecognition();

    testAppsScriptConnection();

  }
);


async function testAppsScriptConnection() {

  const status =
    document.getElementById(
      'apiStatus'
    );


  const dataBox =
    document.getElementById(
      'dataBox'
    );


  status.className =
    'api-status loading';


  status.textContent =
    '⏳ Apps Script에 연결 중...';


  dataBox.classList.remove(
    'show'
  );


  if (
    !APPS_SCRIPT_URL ||
    APPS_SCRIPT_URL.includes(
      '여기에_'
    )
  ) {

    status.className =
      'api-status error';


    status.textContent =
      '❌ APPS_SCRIPT_URL을 아직 입력하지 않았습니다.';


    return;

  }


  try {

    const url =

      APPS_SCRIPT_URL +

      (
        APPS_SCRIPT_URL.includes('?')
          ? '&'
          : '?'
      )

      +

      'api=initial';


    const response =

      await fetch(
        url,
        {
          method: 'GET'
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        'HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'API 요청 실패'
      );

    }


    const data =
      result.data;


    status.className =
      'api-status success';


    status.textContent =
      '✓ GitHub Pages ↔ Apps Script 연결 성공';


    document.getElementById(
      'employeeCount'
    ).textContent =

      data.employeeCount +
      '명';


    document.getElementById(
      'employmentStatus'
    ).textContent =

      (
        data.employmentStatus ||
        []
      ).join(' / ');


    document.getElementById(
      'buList'
    ).textContent =

      (
        data.buList ||
        []
      ).join(' / ');


    document.getElementById(
      'educationList'
    ).textContent =

      (
        data.educationList ||
        []
      ).join(' / ');


    dataBox.classList.add(
      'show'
    );

  }

  catch (error) {

    console.error(
      error
    );


    status.className =
      'api-status error';


    status.textContent =

      '❌ 외부 연결 실패: ' +

      error.message;

  }

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

let recognition = null;

let listening = false;

let finalTranscript = '';


function initializeSpeechRecognition() {

  const SpeechRecognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    showVoicePanel();


    setVoiceState(
      'error',
      '음성 인식 미지원',
      '현재 브라우저에서는 음성 인식을 사용할 수 없습니다.'
    );


    document.getElementById(
      'micButton'
    ).disabled =
      true;


    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'ko-KR';


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function() {

      listening =
        true;


      finalTranscript =
        '';


      document.getElementById(
        'query'
      ).value =
        '';


      document.getElementById(
        'recognizedText'
      ).textContent =
        '-';


      const button =

        document.getElementById(
          'micButton'
        );


      button.classList.add(
        'listening'
      );


      button.textContent =
        '⏹️';


      showVoicePanel();


      setVoiceState(
        'listening',
        '🔴 듣는 중...',
        '검색 조건을 말씀해주세요.'
      );

    };


  recognition.onspeechstart =
    function() {

      setVoiceState(
        'listening',
        '🎙️ 음성 인식 중...',
        '계속 말씀해주세요.'
      );

    };


  recognition.onresult =
    function(event) {

      let interimTranscript =
        '';


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const transcript =

          event.results[i][0]
            .transcript;


        if (
          event.results[i].isFinal
        ) {

          finalTranscript +=
            transcript;

        }

        else {

          interimTranscript +=
            transcript;

        }

      }


      const text =

        (
          finalTranscript +
          interimTranscript
        ).trim();


      document.getElementById(
        'query'
      ).value =
        text;


      document.getElementById(
        'recognizedText'
      ).textContent =

        text || '-';


      if (text) {

        setVoiceState(
          'listening',
          '🎙️ 인식 중...',
          text
        );

      }

    };


  recognition.onend =
    function() {

      listening =
        false;


      const button =

        document.getElementById(
          'micButton'
        );


      button.classList.remove(
        'listening'
      );


      button.textContent =
        '🎤';


      const text =

        document.getElementById(
          'query'
        ).value.trim();


      if (text) {

        setVoiceState(
          'success',
          '✓ 음성 인식 완료',
          '정상적으로 음성이 텍스트로 변환되었습니다.'
        );

      }

      else {

        setVoiceState(
          'error',
          '음성을 인식하지 못했습니다',
          '마이크를 다시 눌러 말씀해주세요.'
        );

      }

    };


  recognition.onerror =
    function(event) {

      listening =
        false;


      const button =

        document.getElementById(
          'micButton'
        );


      button.classList.remove(
        'listening'
      );


      button.textContent =
        '🎤';


      let message =

        '음성 인식 오류: ' +
        event.error;


      if (
        event.error ===
        'not-allowed'
      ) {

        message =
          '마이크 권한이 차단되었습니다. 사이트의 마이크 권한을 허용해주세요.';

      }


      if (
        event.error ===
        'no-speech'
      ) {

        message =
          '음성이 감지되지 않았습니다. 다시 말씀해주세요.';

      }


      setVoiceState(
        'error',
        '음성 인식 오류',
        message
      );

    };

}


/* =========================================================
   MIC
========================================================= */

function toggleVoice() {

  if (!recognition) {

    alert(
      '현재 브라우저에서는 음성 인식을 사용할 수 없습니다.'
    );

    return;

  }


  if (listening) {

    recognition.stop();

    return;

  }


  try {

    recognition.start();

  }

  catch (error) {

    showVoicePanel();


    setVoiceState(
      'error',
      '마이크 시작 실패',
      error.message
    );

  }

}


/* =========================================================
   VOICE UI
========================================================= */

function showVoicePanel() {

  document.getElementById(
    'voicePanel'
  ).classList.add(
    'show'
  );

}


function setVoiceState(
  state,
  title,
  message
) {

  const dot =

    document.getElementById(
      'stateDot'
    );


  dot.className =
    'dot';


  if (
    state ===
    'listening'
  ) {

    dot.classList.add(
      'listening'
    );

  }


  else if (
    state ===
    'success'
  ) {

    dot.classList.add(
      'success'
    );

  }


  else if (
    state ===
    'error'
  ) {

    dot.classList.add(
      'error'
    );

  }


  document.getElementById(
    'stateText'
  ).textContent =
    title;


  document.getElementById(
    'voiceMessage'
  ).textContent =
    message;

}

</script>

</body>
</html>
